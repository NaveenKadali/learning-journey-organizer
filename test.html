<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Script Test</title>
</head>
<body style="font-family: sans-serif; padding: 40px; text-align: center;">

  <h1>Script Execution Test</h1>

  <p id="status" style="font-size: 1.3em; font-weight: bold; color: red;">
    ❌ Script has NOT run yet
  </p>

  <button id="btn" style="font-size: 1.2em; padding: 12px 24px;" onclick="testClick()">
    Tap me
  </button>

  <p id="click-result" style="margin-top: 20px; font-size: 1.1em;"></p>

  <script>
    // This should run immediately on page load, no user interaction needed.
    document.getElementById('status').textContent = '✅ Script DID run on load';
    document.getElementById('status').style.color = 'green';

    function testClick() {
      document.getElementById('click-result').textContent =
        '✅ Button click handler works too. Time: ' + new Date().toLocaleTimeString();
    }

    // Expose a couple of globals so they can be checked from the console too
    window.scriptRanOnLoad = true;
  </script>

</body>
</html>
