<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Page Diagnostic</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background:#111; color:#fff;">
  <h2>On-Page Diagnostic (no console needed)</h2>
  <div id="result" style="font-size: 1.1em; line-height: 1.8; white-space: pre-wrap;">Running checks...</div>

  <script>
    const lines = [];
    function log(label, val) { lines.push(label + ': ' + val); render(); }
    function render() { document.getElementById('result').textContent = lines.join('\n'); }

    log('Script started', 'YES, you are reading this so JS runs');
    log('document.readyState', document.readyState);

    // Try to load the REAL app script as text and check it for syntax errors
    // and check if defining it in THIS page's context works.
    fetch('https://naveenkadali.github.io/learning-journey-organizer/')
      .then(r => r.text())
      .then(html => {
        log('Fetched live index.html, length', html.length);
        const m = html.match(/<script>([\s\S]*)<\/script>/);
        if (!m) { log('ERROR', 'No <script> tag found in fetched HTML!'); return; }
        const code = m[1];
        log('Extracted script length', code.length);
        log('Contains "function boot"', code.includes('function boot'));
        log('Contains "function toggleTheme"', code.includes('function toggleTheme'));

        // Try actually running it right here and see what happens
        try {
          const fn = new Function(code + '; window.__TEST_boot = typeof boot; window.__TEST_toggleTheme = typeof toggleTheme;');
          fn();
          log('Eval succeeded, typeof boot inside eval', window.__TEST_boot);
          log('Eval succeeded, typeof toggleTheme inside eval', window.__TEST_toggleTheme);
        } catch (e) {
          log('EVAL THREW', e.name + ': ' + e.message);
          log('Stack', e.stack.split('\n').slice(0,3).join(' | '));
        }
      })
      .catch(e => log('FETCH FAILED', e.message));
  </script>
</body>
</html>
